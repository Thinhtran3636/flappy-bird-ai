<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird AI - Điều khiển bằng cử chỉ tay</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #12121f, #1e1e36);
            color: white;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
        }
        h1 {
            margin: 5px 0 8px 0;
            color: #00ffcc;
            letter-spacing: 1px;
        }
        #status {
            color: #ffdd57;
            font-size: 16px;
            font-weight: bold;
            margin: 0 0 18px 0;
        }
        /* Bố cục 2 cột song song cực gọn */
        .main-layout {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 28px;
            flex-wrap: wrap;
        }
        /* Cột trái: Khung Game */
        #game_canvas {
            border: 4px solid #00ffcc;
            border-radius: 16px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.25);
            cursor: pointer;
        }
        /* Cột phải: Bảng điều khiển Webcam AI */
        .ai-panel {
            background: rgba(255, 255, 255, 0.05);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            width: 400px;
        }
        .camera-container {
            position: relative;
            width: 360px;
            height: 270px;
            margin: 0 auto 15px auto;
        }
        #webcam, #output_canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 360px;
            height: 270px;
            border-radius: 12px;
            transform: scaleX(-1);
        }
        #webcam {
            border: 2px solid #00f5ff;
        }
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }
        .info-box {
            background-color: #25253d;
            padding: 10px;
            border-radius: 10px;
            border: 2px solid #3c3c5e;
            font-size: 14px;
            transition: all 0.08s;
        }
        .info-box.full-width {
            grid-column: span 2;
            font-size: 16px;
        }
        .info-box.active-jump {
            background-color: #00ff88;
            color: #12121f;
            border-color: #ffffff;
            transform: scale(1.04);
            font-weight: bold;
        }
        .guide {
            text-align: left;
            font-size: 14px;
            color: #cfd2e8;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.25);
            padding: 12px 15px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>🐦 FLAPPY BIRD - HAND GESTURE AI</h1>
    <p id="status">⏳ Đang tải bộ não AI...</p>

    <div class="main-layout">
        <!-- BÊN TRÁI: GAME FLAPPY BIRD -->
        <div>
            <canvas id="game_canvas" width="420" height="600"></canvas>
        </div>

        <!-- BÊN PHẢI: WEBCAM AI & THÔNG SỐ -->
        <div class="ai-panel">
            <div class="camera-container">
                <video id="webcam" autoplay playsinline></video>
                <canvas id="output_canvas"></canvas>
            </div>

            <div class="info-grid">
                <div class="info-box full-width" id="jump-box">
                    Trạng thái tay: <span id="gesture-state">Đang mở</span>
                </div>
                <div class="info-box">Số lần nhảy: <strong id="jump-count">0</strong></div>
                <div class="info-box">Tỷ lệ chụm: <strong id="ratio-text">0.00</strong></div>
            </div>

            <div class="guide">
                <strong>📖 Cách chơi:</strong><br>
                1. Giơ 1 bàn tay rõ trước webcam.<br>
                2. <strong>Chụm ngón cái + ngón trỏ</strong> để chim bay lên.<br>
                3. Mở nhẹ ra rồi chụm tiếp để giữ thăng bằng qua ống!
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
